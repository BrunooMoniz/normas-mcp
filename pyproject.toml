[project]
name = "normas-mcp"
version = "0.1.0"
description = "Servidor MCP com as normas do Banco Central, do CMN e da CVM sobre prestadoras de serviços de ativos virtuais (PSAV), por artigo e com a situação de vigência"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[project.scripts]
normas-mcp = "normas_mcp.servidor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normas_mcp"]
